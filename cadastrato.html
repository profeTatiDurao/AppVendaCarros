<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Auto Motors</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a5f);
            color: #172033;
        }

        .cartao {
            width: 100%;
            max-width: 390px;
            padding: 32px 30px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, .25);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .subtitulo {
            color: #64748b;
            text-align: center;
            margin-bottom: 25px;
        }

        .grupo-input {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #mensagem {
            min-height: 20px;
            color: #dc2626;
            font-size: 14px;
            text-align: center;
        }

        a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="cartao">
        <h1>Criar cadastro</h1>
        <p class="subtitulo">Preencha os dados para acessar o catálogo</p>
        
        
    </main>
    <script type="module" src="app.js"></script>
</body>

</html>
